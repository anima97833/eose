<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>视觉小说 (Visual Novel) 对话界面 1:1 复刻</title>
  <style>
    /* ================= 1. 全局重置与容器规范 ================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Noto Serif TC", "Source Han Serif TC", "Songti SC", "SimSun", "Times New Roman", serif;
    }

    /* 16:9 主舞台容器 */
    .vn-stage {
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      background-color: #000;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      cursor: pointer;
    }

    /* ================= Layer 1: 场景背景层 (z-index: 1) ================= */
    .bg-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      background-size: cover;
      background-position: center;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.45);
      transition: background-image 0.6s ease;
    }

    /* ================= Layer 2: 中心角色立绘层 (z-index: 2) ================= */
    .sprite-layer {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      height: 92%;
      z-index: 2;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .sprite-layer img {
      height: 100%;
      max-width: 90vw;
      object-fit: contain;
      mix-blend-mode: multiply; /* 让白底自然透明融合 */
      filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.45));
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    /* ================= Layer 3: 对话框 UI 核心层 (z-index: 3) ================= */
    .ui-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    /* 3.1 对话底框 */
    .message-box {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 28%;
      background: linear-gradient(
        90deg,
        rgba(20, 24, 38, 0.35) 0%,
        rgba(20, 24, 38, 0.78) 15%,
        rgba(20, 24, 38, 0.78) 85%,
        rgba(20, 24, 38, 0.35) 100%
      );
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      pointer-events: auto;
    }

    /* 顶部发光分割线 */
    .glowing-divider {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent 2%,
        rgba(165, 180, 252, 0.75) 15%,
        rgba(165, 180, 252, 0.75) 85%,
        transparent 98%
      );
      box-shadow: 0 0 8px rgba(165, 180, 252, 0.65), 0 0 2px rgba(255, 255, 255, 0.9);
    }

    /* 3.2 说话者姓名栏 */
    .name-tag {
      position: absolute;
      top: -36px;
      left: 0;
      width: 44%;
      height: 36px;
      clip-path: polygon(0 0, 93% 0, 100% 50%, 93% 100%, 0 100%);
      background: linear-gradient(
        90deg,
        rgba(35, 45, 80, 0.45) 0%,
        rgba(50, 62, 110, 0.85) 60%,
        rgba(75, 90, 150, 0.92) 100%
      );
      display: flex;
      align-items: center;
      padding-left: 215px; /* 避开左下角女主头像 */
      position: absolute;
      border-top: 1px solid rgba(190, 205, 255, 0.4);
    }

    /* 姓名栏右侧内嵌几何细线装饰 */
    .name-tag::after {
      content: "";
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 0;
      right: 5px;
      clip-path: polygon(0 0, 93% 0, 100% 50%, 93% 100%, 0 100%);
      border-right: 1.5px solid rgba(199, 210, 254, 0.6);
      pointer-events: none;
    }

    .name-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.08em;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95), 0 0 6px rgba(0, 0, 0, 0.85);
      white-space: nowrap;
    }

    /* 3.3 左下角女主胸像 */
    .protagonist-avatar {
      position: absolute;
      bottom: 0;
      left: 2.2%;
      width: 180px;
      height: 230px;
      z-index: 5;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    /* 头像背面弧形半透明光晕 */
    .protagonist-avatar::before {
      content: "";
      position: absolute;
      width: 175px;
      height: 175px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(165, 180, 252, 0.25) 0%, rgba(255, 255, 255, 0.05) 70%, transparent 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      bottom: 20px;
      left: 5px;
      z-index: -1;
      filter: blur(1px);
    }

    .protagonist-avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      mix-blend-mode: multiply;
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.5));
    }

    /* 3.4 对话正文区 */
    .dialogue-content {
      margin-left: 25.5%;
      margin-top: 22px;
      width: 58%;
      color: #ffffff;
      font-size: 1.35rem;
      line-height: 1.85;
      letter-spacing: 0.08em;
      text-shadow:
        0 1px 2px #000,
        0 -1px 2px #000,
        1px 0 2px #000,
        -1px 0 2px #000,
        0 2px 6px rgba(0, 0, 0, 0.9);
      min-height: 3.7em;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* 3.5 右侧交错蜂巢六边形快捷菜单 */
    .quick-menu {
      position: absolute;
      right: 3.5%;
      bottom: 18px;
      z-index: 6;
      display: flex;
      flex-direction: column;
      gap: 3px;
      pointer-events: auto;
    }

    /* 每一行六边形嵌套与交错偏移 */
    .hex-row {
      display: flex;
    }
    .hex-row.row-1 {
      margin-left: 0;
    }
    .hex-row.row-2 {
      margin-left: 28px; /* 向右下错开 */
      margin-top: -12px;
    }
    .hex-row.row-3 {
      margin-left: 0; /* 向左下回缩 */
      margin-top: -12px;
    }

    .hex-btn {
      width: 54px;
      height: 60px;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      background: rgba(140, 150, 180, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #cbd5e1;
      font-size: 0.85rem;
      font-family: inherit;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      position: relative;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 六边形微光边框模拟 */
    .hex-btn::before {
      content: "";
      position: absolute;
      inset: 1.5px;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      background: rgba(45, 55, 80, 0.55);
      z-index: -1;
      transition: background 0.2s ease;
    }

    .hex-btn:hover {
      transform: scale(1.08);
      color: #ffffff;
    }
    .hex-btn:hover::before {
      background: rgba(65, 80, 125, 0.75);
    }
    .hex-btn:active {
      transform: scale(0.96);
    }

    /* ================= Layer 4: 底部版权与脉冲指示器 (z-index: 10) ================= */
    .copyright {
      position: absolute;
      bottom: 4px;
      width: 100%;
      text-align: center;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.04em;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
      pointer-events: none;
      z-index: 10;
    }

    /* 等待点击旋转星芒指示器 */
    .next-indicator {
      position: absolute;
      right: 1.8%;
      bottom: 20px;
      z-index: 10;
      width: 16px;
      height: 16px;
      display: none; /* 打字完成才显示 */
      pointer-events: none;
      animation: starRotate 2.5s infinite linear;
    }

    .next-indicator svg {
      width: 100%;
      height: 100%;
      fill: #ffffff;
      filter: drop-shadow(0 0 4px rgba(165, 180, 252, 0.9));
    }

    @keyframes starRotate {
      0% { transform: rotate(0deg) scale(0.9); opacity: 0.7; }
      50% { transform: rotate(180deg) scale(1.15); opacity: 1; }
      100% { transform: rotate(360deg) scale(0.9); opacity: 0.7; }
    }

    /* ================= 历史回溯弹窗 (Log Modal) ================= */
    .log-modal {
      position: absolute;
      inset: 0;
      background: rgba(10, 15, 25, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 50;
      display: none;
      flex-direction: column;
      padding: 30px 50px;
      color: #fff;
      pointer-events: auto;
    }

    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .log-header h2 {
      font-size: 1.3rem;
      letter-spacing: 0.1em;
      color: #c7d2fe;
    }

    .log-close-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 4px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .log-close-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .log-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-right: 10px;
    }

    .log-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.12);
      padding-bottom: 12px;
    }

    .log-speaker {
      font-size: 0.95rem;
      color: #a5b4fc;
      font-weight: 700;
    }

    .log-text {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #e2e8f0;
    }
  </style>
</head>
<body>

  <!-- 主舞台容器 (16:9 比例居中) -->
  <div class="vn-stage" id="vnStage">

    <!-- Layer 1: 场景背景层 -->
    <div class="bg-layer" id="bgLayer"></div>

    <!-- Layer 2: 中央男性角色立绘层 -->
    <div class="sprite-layer" id="spriteLayer">
      <img id="mainSprite" src="" alt="立绘">
    </div>

    <!-- Layer 3: 对话框 UI 核心层 -->
    <div class="ui-layer">
      <!-- 对话底框 -->
      <div class="message-box" id="messageBox">
        <!-- 顶部发光分割线 -->
        <div class="glowing-divider"></div>

        <!-- 3.2 说话者姓名栏 -->
        <div class="name-tag">
          <span class="name-text" id="nameText">弑君的惡魔</span>
        </div>

        <!-- 3.3 左下角女主胸像 -->
        <div class="protagonist-avatar">
          <img id="heroineAvatar" src="" alt="女主头像">
        </div>

        <!-- 3.4 对话正文区 -->
        <div class="dialogue-content" id="dialogueContent"></div>

        <!-- 3.5 右侧六边形快捷菜单 (交错蜂巢布局) -->
        <div class="quick-menu" id="quickMenu">
          <div class="hex-row row-1">
            <button class="hex-btn" id="btnMenu" title="系统菜单">Menu</button>
          </div>
          <div class="hex-row row-2">
            <button class="hex-btn" id="btnLog" title="台词历史记录">Log</button>
          </div>
          <div class="hex-row row-3">
            <button class="hex-btn" id="btnJump" title="跳转下一幕">Jump</button>
          </div>
        </div>

        <!-- 等待点击星芒指示器 -->
        <div class="next-indicator" id="nextIndicator">
          <svg viewBox="0 0 24 24">
            <polygon points="12,0 14.5,9.5 24,12 14.5,14.5 12,24 9.5,14.5 0,12 9.5,9.5"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Layer 4: 底部版权声明 -->
    <div class="copyright">
      ©IDEA FACTORY/KOGADO STUDIO All rights reserved. Licensed to and published by Joyoland.
    </div>

    <!-- 历史记录回溯弹窗 -->
    <div class="log-modal" id="logModal">
      <div class="log-header">
        <h2>RECOLLECTION LOG · 台词历史记录</h2>
        <button class="log-close-btn" id="btnCloseLog">关闭 (ESC)</button>
      </div>
      <div class="log-list" id="logList"></div>
    </div>

  </div>

  <script>
    // ================= 1. 媒体素材统一配置 (方便外部替换) =================
    const ASSETS = {
      // 场景背景 (废弃礼拜堂庭院阳光)
      background: 'galgame/bg.jpg',
      // 中央角色立绘 (白军装银发红眼恶魔统帅)
      mainCharacter: 'galgame/demon.png',
      // 左下角女主头像胸像
      heroineAvatar: 'galgame/heroine.png',
    };

    // ================= 2. 剧本数据 (台词序列) =================
    const SCRIPT = [
      {
        speaker: '弑君的惡魔',
        text: '「我不會現在就殺了妳。\n  停止無謂的抵抗。」',
        avatarState: 'shocked',
      },
      {
        speaker: '塞西莉亚',
        text: '「……你究竟是谁？\n  为什么要在这座废弃的圣堂里拦住我？」',
        avatarState: 'serious',
      },
      {
        speaker: '弑君的惡魔',
        text: '「我是谁并不重要。重要的是——\n  妳手中的王室徽章，沾满了虚伪的荣光。」',
        avatarState: 'calm',
      },
      {
        speaker: '弑君的惡魔',
        text: '「如果还想活着走出这片森林，\n  就顺从命运，留在我身边。」',
        avatarState: 'confident',
      }
    ];

    // ================= 3. 核心逻辑状态 =================
    let currentIndex = 0;
    let isTyping = false;
    let typeTimer = null;
    let currentFullText = '';
    let currentDisplayedText = '';
    const readHistory = [];

    // DOM 元素引用
    const vnStage = document.getElementById('vnStage');
    const bgLayer = document.getElementById('bgLayer');
    const mainSprite = document.getElementById('mainSprite');
    const heroineAvatar = document.getElementById('heroineAvatar');
    const nameText = document.getElementById('nameText');
    const dialogueContent = document.getElementById('dialogueContent');
    const nextIndicator = document.getElementById('nextIndicator');
    const btnLog = document.getElementById('btnLog');
    const btnMenu = document.getElementById('btnMenu');
    const btnJump = document.getElementById('btnJump');
    const logModal = document.getElementById('logModal');
    const btnCloseLog = document.getElementById('btnCloseLog');
    const logList = document.getElementById('logList');

    // 初始化素材加载
    function initAssets() {
      bgLayer.style.backgroundImage = `url('${ASSETS.background}')`;
      mainSprite.src = ASSETS.mainCharacter;
      heroineAvatar.src = ASSETS.heroineAvatar;
    }

    // 打字机播放函数 (35ms 逐字打印)
    function playDialogue(index) {
      if (index >= SCRIPT.length) {
        currentIndex = 0; // 循环播放
      }
      const item = SCRIPT[currentIndex];
      nameText.textContent = item.speaker;
      currentFullText = item.text;
      currentDisplayedText = '';
      dialogueContent.textContent = '';
      isTyping = true;
      nextIndicator.style.display = 'none';

      // 记录到已读历史
      readHistory.push({ speaker: item.speaker, text: item.text });

      let charIndex = 0;
      clearInterval(typeTimer);

      typeTimer = setInterval(() => {
        if (charIndex < currentFullText.length) {
          currentDisplayedText += currentFullText[charIndex];
          dialogueContent.textContent = currentDisplayedText;
          charIndex++;
        } else {
          finishTyping();
        }
      }, 35);
    }

    // 瞬间补全当前句
    function finishTyping() {
      clearInterval(typeTimer);
      dialogueContent.textContent = currentFullText;
      isTyping = false;
      nextIndicator.style.display = 'block';
    }

    // 点击前进逻辑
    function handleStageClick(e) {
      // 避免点击菜单按钮触发切台词
      if (e.target.closest('.quick-menu') || e.target.closest('.log-modal')) return;

      if (isTyping) {
        // 打字过程中点击：立刻瞬间补齐
        finishTyping();
      } else {
        // 打字完成后点击：播放下一句
        currentIndex = (currentIndex + 1) % SCRIPT.length;
        playDialogue(currentIndex);
      }
    }

    // 打开历史记录弹窗
    function openLog() {
      logList.innerHTML = '';
      readHistory.forEach((log) => {
        const item = document.createElement('div');
        item.className = 'log-item';
        item.innerHTML = `
          <div class="log-speaker">${log.speaker}</div>
          <div class="log-text">${log.text.replace(/\n/g, '<br>')}</div>
        `;
        logList.appendChild(item);
      });
      logModal.style.display = 'flex';
      logList.scrollTop = logList.scrollHeight;
    }

    // 关闭历史记录弹窗
    function closeLog() {
      logModal.style.display = 'none';
    }

    // 事件绑定
    vnStage.addEventListener('click', handleStageClick);
    btnLog.addEventListener('click', (e) => {
      e.stopPropagation();
      openLog();
    });
    btnCloseLog.addEventListener('click', (e) => {
      e.stopPropagation();
      closeLog();
    });
    btnMenu.addEventListener('click', (e) => {
      e.stopPropagation();
      alert('【系统菜单】\n• 自动播放 (Auto)\n• 快速跳过 (Skip)\n• 剧本剧情编辑模式\n• 返回时光书屋');
    });
    btnJump.addEventListener('click', (e) => {
      e.stopPropagation();
      currentIndex = (currentIndex + 1) % SCRIPT.length;
      playDialogue(currentIndex);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLog();
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        handleStageClick({ target: vnStage });
      }
    });

    // 启动
    initAssets();
    playDialogue(0);
  </script>
</body>
</html>
